category: pessoal
order: 9
year: '2026'
title: ENTARDECER
accent: '#fb923c'
kicker: { pt: "Rede social de casamento", en: "Wedding social network" }
tagline:
  pt: Uma rede social que aguentou um casamento inteiro, em tempo real.
  en: A social network that carried a whole wedding, in real time.
summary:
  pt: Feito para o casamento de amigos. Durante a festa, os convidados postavam fotos e vídeos, votavam em enquetes e jogavam bingo, com tudo projetado no telão. Depois, o app virou um museu permanente de memórias.
  en: Built for friends' wedding. During the party guests posted photos and videos, voted in polls and played bingo, all shown on the big screen. Afterwards the app became a permanent memory museum.
role:
  pt: Desenvolvimento e design, do convite em QR code ao museu.
  en: Development and design, from the QR-code invitation to the museum.
stack: [Next.js, TypeScript, PostgreSQL, PWA]
work:
  - phase: planejamento
    text:
      pt: "Defini com os noivos o que o app precisava ter, do convite ao pós-festa."
      en: "Worked out with the couple what the app needed, from the invitation to after the party."
  - phase: design
    text:
      pt: "Design do app inteiro, do convite em QR code ao museu de memórias."
      en: "Design of the whole app, from the QR-code invitation to the memory museum."
  - phase: desenvolvimento
    text:
      pt: "Feed em tempo real, enquetes, bingo, modo telão e fila offline para internet ruim."
      en: "Real-time feed, polls, bingo, projector mode and an offline queue for bad connections."
  - phase: testes
    text:
      pt: "Testes automatizados antes do grande dia — não tinha segunda chance."
      en: "Automated tests before the big day — there was no second chance."
  - phase: deploy
    text:
      pt: "No ar durante a festa inteira, com todos os convidados ao mesmo tempo."
      en: "Live for the whole party, with every guest on it at once."
  - phase: manutencao
    text:
      pt: "Depois da festa, virou um museu permanente de memórias, com livro exportável."
      en: "After the party, it became a permanent memory museum with an exportable book."
highlights:
  - pt: Feed em tempo real com upload comprimido no próprio celular e fila offline.
    en: Real-time feed with on-device compressed uploads and an offline queue.
  - pt: Modo telão, enquetes ao vivo, gamificação e um livro de memórias exportado em PDF, XLSX e DOCX.
    en: Projector mode, live polls, gamification and a memory book exported to PDF, XLSX and DOCX.
  - pt: Privacidade levada a sério — cada um só vê o que deve, mídias protegidas e um botão "apagar meus dados".
    en: Privacy taken seriously — everyone sees only what they should, protected media and a "delete my data" button.
status: evento
