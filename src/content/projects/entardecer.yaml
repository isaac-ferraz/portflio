category: pessoal
order: 9
year: '2026'
title: ENTARDECER
accent: '#fb923c'
kicker: { pt: Rede social de casamento, en: Wedding social network }
tagline:
  pt: Uma rede social que aguentou um casamento inteiro, em tempo real.
  en: A social network that carried a whole wedding, in real time.
summary:
  pt: Feito para o casamento de amigos. Durante a festa, os convidados postavam fotos e vídeos, votavam em enquetes e jogavam bingo, com tudo projetado no telão. Depois, o app virou um museu permanente de memórias.
  en: Built for friends' wedding. During the party guests posted photos and videos, voted in polls and played bingo, all shown on the big screen. Afterwards the app became a permanent memory museum.
role:
  pt: Desenvolvimento e design, do convite em QR code ao museu.
  en: Development and design, from the QR-code invitation to the museum.
stack: [Next.js 14, TypeScript, Prisma, Supabase, Realtime, PWA, Vitest, Playwright]
highlights:
  - pt: Feed em tempo real com upload comprimido no próprio celular e fila offline.
    en: Real-time feed with on-device compressed uploads and an offline queue.
  - pt: Modo telão, enquetes ao vivo, gamificação e um livro de memórias exportado em PDF, XLSX e DOCX.
    en: Projector mode, live polls, gamification and a memory book exported to PDF, XLSX and DOCX.
  - pt: RLS em todas as tabelas, URLs assinadas e um botão "apagar meus dados".
    en: RLS on every table, signed URLs and a "delete my data" button.
