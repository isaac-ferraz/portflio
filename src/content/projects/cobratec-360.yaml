category: profissional
order: 1
year: '2026'
org: Cobratec
title: Cobratec 360
accent: '#38bdf8'
kicker: { pt: "Plataforma interna", en: "Internal platform" }
tagline:
  pt: Começou como inventário de hardware do TI e virou a plataforma interna da empresa.
  en: It started as the IT hardware inventory and grew into the company's internal platform.
summary:
  pt: Uma plataforma web modular que reúne inventário de hardware, chamados de TI, analytics de cobrança, disparo de e-mail com conformidade e um CRM de cobrança com ficha 360 do devedor. Roda em produção na rede do escritório.
  en: A modular web platform that brings together hardware inventory, IT tickets, collections analytics, compliant e-mail campaigns and a collections CRM with a 360° debtor view. It runs in production on the office network.
role:
  pt: Desenvolvedor do sistema de ponta a ponta — requisitos com o TI e a cobrança, arquitetura, código, testes e deploy.
  en: End-to-end developer — requirements with IT and collections, architecture, code, tests and deployment.
stack: [Next.js, TypeScript, PostgreSQL, Docker]
work:
  - phase: planejamento
    text:
      pt: "Levantei os requisitos com o TI e a cobrança e priorizei as entregas, começando pelo inventário."
      en: "Gathered requirements with IT and collections and prioritised the deliveries, starting with the inventory."
  - phase: design
    text:
      pt: "Desenhei a arquitetura modular e as telas de cada área junto com quem usa."
      en: "Designed the modular architecture and each area’s screens together with the people who use them."
  - phase: desenvolvimento
    text:
      pt: "Front-end, back-end e banco de dados de todos os módulos."
      en: "Front end, back end and database for every module."
  - phase: testes
    text:
      pt: "Mais de 1.600 testes automatizados rodando a cada mudança."
      en: "Over 1,600 automated tests running on every change."
  - phase: deploy
    text:
      pt: "Publicação na rede do escritório, com verificação automática antes de cada versão."
      en: "Deployment on the office network, with automated checks before every release."
  - phase: manutencao
    text:
      pt: "Acompanho o uso, corrijo, evoluo os módulos e confiro os indicadores contra os relatórios oficiais."
      en: "I monitor usage, fix issues, evolve the modules and check the KPIs against the official reports."
highlights:
  - pt: Tarefas em segundo plano e atualizações em tempo real, sem depender de serviços pagos.
    en: Background jobs and real-time updates, without relying on paid services.
  - pt: Trilha de auditoria completa e permissões por perfil de acesso.
    en: A complete audit trail and role-based permissions.
  - pt: LGPD desde o desenho — dados pessoais mascarados, retenção e purga de conversas e descadastro que vale em todos os canais.
    en: Privacy by design (LGPD) — masked personal data, conversation retention and purge, and an opt-out that applies across every channel.
  - pt: Indicadores conferidos linha a linha contra os relatórios oficiais do sistema de cobrança.
    en: KPIs checked line by line against the official reports of the collections system.
metrics:
  - { value: '1.600+', label: { pt: "testes automatizados", en: "automated tests" } }
  - { value: '100+', label: { pt: "rotas de API", en: "API routes" } }
  - { value: '80+', label: { pt: "decisões documentadas", en: "documented decisions" } }
  - { value: 'R$ 0', label: { pt: "em licenças", en: "in licences" } }
status: producao
