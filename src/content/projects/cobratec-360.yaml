sections:
  - title: { pt: "O problema", en: "The problem" }
    body:
      pt: O TI controlava computadores, celulares e chamados em planilhas soltas, e a cobrança dependia de relatórios montados à mão. Cada área tinha a sua versão da verdade.
      en: IT tracked computers, phones and tickets in loose spreadsheets, and collections relied on hand-built reports. Every team had its own version of the truth.
  - title: { pt: "Como resolvi", en: "How I solved it" }
    items:
      - { pt: "Comecei pequeno — o inventário — e fui ganhando a confiança das áreas a cada entrega.", en: "I started small — the inventory — and earned each team's trust delivery by delivery." }
      - { pt: "A arquitetura evoluiu junto com o sistema, sem parar quem já usava.", en: "The architecture evolved with the system, without stopping the people already using it." }
      - { pt: "Cada decisão relevante virou um registro escrito, com contexto e alternativas.", en: "Every relevant decision became a written record, with context and alternatives." }
      - { pt: "Deploy automatizado, com cada mudança verificada antes de chegar em produção.", en: "Automated deployment, with every change verified before it reaches production." }
