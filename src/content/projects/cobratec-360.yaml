title: Cobratec 360
accent: '#38bdf8'
kicker: { pt: Plataforma interna, en: Internal platform }
tagline:
  pt: Começou como inventário de hardware do TI e virou a plataforma interna da empresa.
  en: It started as the IT hardware inventory and grew into the company's internal platform.
summary:
  pt: Um monólito modular em Next.js que reúne inventário de hardware, chamados de TI, analytics de cobrança, disparo de e-mail com conformidade e um CRM de cobrança com ficha 360 do devedor. Roda em produção na rede do escritório.
  en: A modular Next.js monolith that brings together hardware inventory, IT tickets, collections analytics, compliant e-mail campaigns and a collections CRM with a 360° debtor view. It runs in production on the office network.
role:
  pt: Desenvolvedor do sistema de ponta a ponta — requisitos com o TI e a cobrança, arquitetura, código, testes e deploy.
  en: End-to-end developer — requirements with IT and collections, architecture, code, tests and deployment.
stack: [Next.js 15, React 19, TypeScript, Prisma, PostgreSQL, Docker, Vitest, GitHub Actions]
highlights:
  - pt: Fila de tarefas no próprio Postgres com FOR UPDATE SKIP LOCKED, eleição de líder por advisory lock e LISTEN/NOTIFY para tempo real.
    en: Job queue inside Postgres with FOR UPDATE SKIP LOCKED, leader election through advisory locks and LISTEN/NOTIFY for real-time updates.
  - pt: Trilha de auditoria append-only, permissões por capacidade e sessão revogável em cookie httpOnly.
    en: Append-only audit trail, capability-based permissions and revocable httpOnly cookie sessions.
  - pt: LGPD desde o desenho — CPF mascarado, retenção e purga de conversas e descadastro que vale em todos os canais.
    en: Privacy by design (LGPD) — masked IDs, conversation retention and purge, and an opt-out that applies across every channel.
  - pt: Indicadores conferidos linha a linha contra os relatórios oficiais do sistema de cobrança.
    en: KPIs checked line by line against the official reports of the collections system.
