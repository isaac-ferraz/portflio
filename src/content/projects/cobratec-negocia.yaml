category: profissional
order: 4
year: '2026'
org: Cobratec
title: Cobratec Negocia
accent: '#25d366'
kicker: { pt: "Negociação no WhatsApp", en: "WhatsApp negotiation" }
tagline:
  pt: Um acordo de ponta a ponta sem sair da conversa do WhatsApp.
  en: An agreement from start to finish without leaving the WhatsApp chat.
summary:
  pt: Serviço integrado à WhatsApp Cloud API da Meta. Um bot conduz o devedor por um WhatsApp Flow — código de acesso, termos, parcelas, revisão e assinatura — até registrar a proposta, com transferência para atendente quando preciso.
  en: A service integrated with Meta's WhatsApp Cloud API. A bot guides the debtor through a WhatsApp Flow — access code, terms, instalments, review and signature — until the proposal is registered, handing off to a human agent when needed.
role:
  pt: Desenvolvedor, em dupla — fluxo do Flow, criptografia, ciclo da proposta e testes.
  en: Developer, in a pair — the Flow journey, encryption, proposal lifecycle and tests.
stack: [Python, FastAPI, PostgreSQL, WhatsApp Cloud API]
work:
  - phase: planejamento
    text:
      pt: "Em dupla, desenhamos a jornada de negociação, do convite à assinatura."
      en: "In a pair, we mapped the negotiation journey, from invitation to signature."
  - phase: design
    text:
      pt: "Telas do WhatsApp Flow — acesso, termos, parcelas, revisão e assinatura."
      en: "The WhatsApp Flow screens — access, terms, instalments, review and signature."
  - phase: desenvolvimento
    text:
      pt: "Integração com o WhatsApp, segurança do endpoint e o ciclo da proposta."
      en: "WhatsApp integration, endpoint security and the proposal lifecycle."
  - phase: testes
    text:
      pt: "Suíte com 58 testes automatizados."
      en: "A suite of 58 automated tests."
  - phase: deploy
    text:
      pt: "Deploy automatizado e repetível."
      en: "Automated, repeatable deployment."
highlights:
  - pt: Conversa criptografada com o WhatsApp e mensagens de entrada autenticadas.
    en: Encrypted exchange with WhatsApp and authenticated incoming messages.
  - pt: Cada proposta com um ciclo claro — pendente, assinada, efetivada, cancelada ou expirada.
    en: Every proposal follows a clear lifecycle — pending, signed, settled, cancelled or expired.
  - pt: Dados pessoais apagados ao fim da sessão e versão dos termos guardada junto do aceite.
    en: Personal data erased at the end of the session, with the terms version stored next to the acceptance.
metrics:
  - { value: '58', label: { pt: "testes", en: "tests" } }
