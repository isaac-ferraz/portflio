org: Cobratec
title: Cobratec Negocia
accent: '#25d366'
kicker: { pt: Negociação no WhatsApp, en: WhatsApp negotiation }
tagline:
  pt: Um acordo de ponta a ponta sem sair da conversa do WhatsApp.
  en: An agreement from start to finish without leaving the WhatsApp chat.
summary:
  pt: API em FastAPI sobre a WhatsApp Cloud API da Meta. Um bot conduz o devedor por um WhatsApp Flow — código de acesso, termos, parcelas, revisão e assinatura — até registrar a proposta, com transferência para atendente quando preciso.
  en: A FastAPI service on Meta's WhatsApp Cloud API. A bot guides the debtor through a WhatsApp Flow — access code, terms, instalments, review and signature — until the proposal is registered, handing off to a human agent when needed.
role:
  pt: Desenvolvedor, em dupla — fluxo do Flow, criptografia, ciclo da proposta e testes.
  en: Developer, in a pair — the Flow journey, encryption, proposal lifecycle and tests.
stack: [Python 3.12, FastAPI, SQLAlchemy async, PostgreSQL, WhatsApp Cloud API, n8n, pytest, Docker]
highlights:
  - pt: Endpoint do Flow com criptografia RSA-OAEP + AES-GCM e webhooks validados por assinatura.
    en: Flow endpoint with RSA-OAEP + AES-GCM encryption and signature-validated webhooks.
  - pt: Ciclo da proposta como máquina de estados — pendente, assinada, efetivada, cancelada ou expirada.
    en: Proposal lifecycle as a state machine — pending, signed, settled, cancelled or expired.
  - pt: CPF apagado ao fim da sessão e versão dos termos gravada junto do aceite.
    en: Personal ID erased at the end of the session, with the terms version stored next to the acceptance.
  - pt: Deploy idempotente em 8 passos, scriptado.
    en: Idempotent, scripted 8-step deployment.
