category: pessoal
order: 10
year: '2026'
title: Cia do Lume
accent: '#facc15'
kicker: { pt: "Jogo infantil", en: "Kids' game" }
tagline:
  pt: Cinco personagens, cinco jogos e nenhum game over.
  en: Five characters, five games and no game over.
summary:
  pt: App de jogos para o ministério infantil da Igreja da Cidade. Cada personagem ensina um dos cinco propósitos da igreja com um jogo próprio — plataforma, ritmo, Snake, Tetris e um quiz de versículos —, com avatar, missões diárias e recompensas.
  en: A game app for Igreja da Cidade's children's ministry. Each character teaches one of the church's five purposes through its own game — platformer, rhythm, Snake, Tetris and a Bible-verse quiz — with avatars, daily missions and rewards.
role:
  pt: Desenvolvimento dos jogos, do meta-jogo e das ferramentas de áudio e captura.
  en: Development of the games, the meta-game and the audio and capture tooling.
stack: [Godot, Python]
work:
  - phase: design
    text:
      pt: "Jogos pensados para crianças: sem game over, alvos de toque grandes e compras que exigem segurar o botão."
      en: "Games designed for kids: no game over, large touch targets and purchases that require holding the button."
  - phase: desenvolvimento
    text:
      pt: "Os cinco jogos, o meta-jogo — avatar, missões e recompensas — e os efeitos sonoros gerados por código."
      en: "The five games, the meta-game — avatar, missions and rewards — and sound effects generated in code."
  - phase: testes
    text:
      pt: "Bots que jogam sozinhos para testar cada fase."
      en: "Bots that play by themselves to test every level."
highlights:
  - pt: Pensado para crianças — sem game over, alvos de toque de 64 px e compras que exigem segurar o botão.
    en: Designed for kids — no game over, 64 px touch targets and purchases that require holding the button.
  - pt: Efeitos sonoros sintetizados por código, sem arquivos de áudio.
    en: Sound effects synthesised in code, with no audio files.
  - pt: Bots que jogam sozinhos para testar cada fase.
    en: Bots that play by themselves to test every level.
