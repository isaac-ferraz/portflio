category: profissional
order: 2
year: '2026'
org: Cobratec
title: Portal Negocie
accent: '#f5b942'
kicker: { pt: Autoatendimento, en: Self-service }
tagline:
  pt: O devedor simula, fecha o acordo e baixa o boleto sozinho, a qualquer hora.
  en: Debtors simulate, close an agreement and download the payment slip on their own, any time.
summary:
  pt: Portal de autoatendimento sobre a API oficial do sistema de cobrança. A pessoa se identifica, confirma um código enviado por e-mail, escolhe entre as opções de parcelamento e recebe os boletos — sem esperar um atendente.
  en: A self-service portal built on the collections system's official API. People identify themselves, confirm a code sent by e-mail, pick an instalment option and get their payment slips — no waiting for an agent.
role:
  pt: Desenvolvedor e Product Owner — levantei as regras com a cobrança e implementei front, back e segurança.
  en: Developer and Product Owner — gathered the rules with the collections team and built front end, back end and security.
stack: [Next.js 14, TypeScript, Tailwind CSS, PostgreSQL, API REST, Resend, Docker]
highlights:
  - pt: Segundo fator por e-mail guardado só como HMAC, com limite de tentativas e respostas iguais para evitar enumeração de CPFs.
    en: E-mail second factor stored only as an HMAC, with attempt limits and identical responses to prevent ID enumeration.
  - pt: Banco acessado só em transações READ ONLY; um fechamento com resultado incerto nunca vira "tente de novo".
    en: Database accessed only in READ ONLY transactions; a close with an uncertain result never turns into "try again".
  - pt: Handoff para o WhatsApp com token assinado no lugar do CPF.
    en: Hand-off to WhatsApp with a signed token instead of the personal ID.
  - pt: Publicado atrás de um túnel SSH reverso — o servidor interno nunca fica exposto.
    en: Published behind a reverse SSH tunnel — the internal server is never exposed.
status: homologacao
links: {}
confidential: true
cover: ../../assets/projects/portal-negocie/escolha.jpg
coverAlt:
  pt: Tela do portal com opções de parcelamento de um acordo.
  en: Portal screen showing instalment options for an agreement.
sections:
  - title: { pt: O problema, en: The problem }
    body:
      pt: Toda negociação passava por um atendente, em horário comercial. Quem queria resolver a dívida à noite ou no fim de semana simplesmente não conseguia.
      en: Every negotiation went through an agent during business hours. People who wanted to settle a debt at night or on weekends simply couldn't.
  - title: { pt: Decisões que importam, en: Decisions that matter }
    items:
      - { pt: Simular de novo antes de registrar o acordo, para nunca gravar uma condição desatualizada., en: Re-simulate before registering the agreement, so an outdated offer is never recorded. }
      - { pt: Travas de carteira para testar em produção sem tocar em clientes reais., en: Portfolio locks to test in production without touching real customers. }
