category: profissional
order: 2
year: '2026'
org: Cobratec
title: Portal Negocie
accent: '#f5b942'
kicker: { pt: "Autoatendimento", en: "Self-service" }
tagline:
  pt: O devedor simula, fecha o acordo e baixa o boleto sozinho, a qualquer hora.
  en: Debtors simulate, close an agreement and download the payment slip on their own, any time.
summary:
  pt: Portal de autoatendimento sobre a API oficial do sistema de cobrança. A pessoa se identifica, confirma um código enviado por e-mail, escolhe entre as opções de parcelamento e recebe os boletos — sem esperar um atendente.
  en: A self-service portal built on the collections system's official API. People identify themselves, confirm a code sent by e-mail, pick an instalment option and get their payment slips — no waiting for an agent.
role:
  pt: Desenvolvedor e Product Owner — levantei as regras com a cobrança e implementei front, back e segurança.
  en: Developer and Product Owner — gathered the rules with the collections team and built front end, back end and security.
stack: [Next.js, TypeScript, PostgreSQL, API REST]
work:
  - phase: planejamento
    text:
      pt: "Como Product Owner, levantei as regras de negociação com a cobrança e montei o backlog."
      en: "As Product Owner, I gathered the negotiation rules with the collections team and built the backlog."
  - phase: design
    text:
      pt: "Desenhei a jornada de autoatendimento, da identificação ao boleto."
      en: "Designed the self-service journey, from identification to payment slip."
  - phase: desenvolvimento
    text:
      pt: "Front-end, back-end, segurança e a integração com a API oficial do sistema de cobrança."
      en: "Front end, back end, security and the integration with the collections system’s official API."
  - phase: testes
    text:
      pt: "Homologação com a cobrança, com travas que permitem testar sem tocar em clientes reais."
      en: "Acceptance testing with collections, with safeguards to test without touching real customers."
  - phase: deploy
    text:
      pt: "Publicação em homologação sem expor o servidor interno da empresa."
      en: "Staging deployment without exposing the company’s internal server."
highlights:
  - pt: Verificação em duas etapas por e-mail e proteção contra tentativas abusivas.
    en: Two-step e-mail verification and protection against abusive attempts.
  - pt: Fechamento à prova de falhas — um resultado incerto nunca vira um acordo duplicado.
    en: Failure-proof closing — an uncertain result never turns into a duplicate agreement.
  - pt: A negociação continua no WhatsApp sem expor dados pessoais.
    en: The negotiation continues on WhatsApp without exposing personal data.
  - pt: Publicado sem expor o servidor interno da empresa.
    en: Published without exposing the company's internal server.
status: homologacao
links: {}
confidential: true
cover: ../../assets/projects/portal-negocie/escolha.jpg
coverAlt:
  pt: Tela do portal com opções de parcelamento de um acordo.
  en: Portal screen showing instalment options for an agreement.
sections:
  - title: { pt: "O problema", en: "The problem" }
    body:
      pt: Toda negociação passava por um atendente, em horário comercial. Quem queria resolver a dívida à noite ou no fim de semana simplesmente não conseguia.
      en: Every negotiation went through an agent during business hours. People who wanted to settle a debt at night or on weekends simply couldn't.
  - title: { pt: "Decisões que importam", en: "Decisions that matter" }
    items:
      - { pt: "Simular de novo antes de registrar o acordo, para nunca gravar uma condição desatualizada.", en: "Re-simulate before registering the agreement, so an outdated offer is never recorded." }
      - { pt: "Travas para testar em produção sem tocar em clientes reais.", en: "Safeguards to test in production without touching real customers." }
