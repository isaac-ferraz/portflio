category: pessoal
order: 11
year: '2026'
title: Painel de Estágio
accent: '#34d399'
kicker: { pt: "Ferramenta própria", en: "Personal tool" }
tagline:
  pt: O resumo do fim do dia virou um painel que o gestor abre quando quiser.
  en: The end-of-day summary became a dashboard my manager can open any time.
summary:
  pt: Meu gestor pediu um resumo diário do estágio. Em vez de mandar mensagens, construí um diário de atividades com minutos por categoria e um painel com a distribuição do trabalho, relatório semanal e exportação em Excel.
  en: My manager asked for a daily internship summary. Instead of sending messages, I built an activity log with minutes per category and a dashboard showing how the work is split, with a weekly report and Excel export.
role:
  pt: Ideia, design e desenvolvimento.
  en: Idea, design and development.
stack: [Next.js, TypeScript, PostgreSQL, Vercel]
work:
  - phase: planejamento
    text:
      pt: "Transformei o pedido do gestor — um resumo diário — num produto."
      en: "Turned my manager’s request — a daily summary — into a product."
  - phase: design
    text:
      pt: "Design do diário e do painel, com gráficos feitos à mão."
      en: "Design of the log and the dashboard, with hand-made charts."
  - phase: desenvolvimento
    text:
      pt: "Diário de atividades, painel, relatório semanal, exportação em Excel e três papéis de acesso."
      en: "Activity log, dashboard, weekly report, Excel export and three access roles."
  - phase: testes
    text:
      pt: "82 testes automatizados, inclusive para o bug de fuso horário."
      en: "82 automated tests, including one for the time-zone bug."
  - phase: deploy
    text:
      pt: "Publicado na nuvem, acessível ao gestor de qualquer lugar."
      en: "Deployed to the cloud, reachable by my manager from anywhere."
  - phase: manutencao
    text:
      pt: "Uso diário no estágio, com ajustes a partir dos comentários do gestor."
      en: "Used every day in the internship, with tweaks based on my manager’s comments."
highlights:
  - pt: Gráficos feitos à mão, sem biblioteca, com bundle inicial de ~106 kB.
    en: Hand-made charts with no library, and a ~106 kB first-load bundle.
  - pt: Testes rodando com TZ=UTC de propósito, para reproduzir o bug de fuso horário da Vercel.
    en: Tests run with TZ=UTC on purpose, to reproduce the Vercel time-zone bug.
  - pt: Três papéis — estagiário, admin e gestor (que só comenta).
    en: Three roles — intern, admin and manager (who can only comment).
metrics:
  - { value: '82', label: { pt: "testes", en: "tests" } }
  - { value: '3', label: { pt: "papéis", en: "roles" } }
status: producao
