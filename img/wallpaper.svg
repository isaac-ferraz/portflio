<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="Papel de parede">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#9fe6ff"/>
      <stop offset=".34"  stop-color="#4fb8f0"/>
      <stop offset=".66"  stop-color="#1a7fc8"/>
      <stop offset="1"    stop-color="#0a4c8f"/>
    </linearGradient>

    <radialGradient id="sunglow" cx=".78" cy=".12" r=".55">
      <stop offset="0"   stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".28" stop-color="#d9f6ff" stop-opacity=".45"/>
      <stop offset="1"   stop-color="#8fe3ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".5"  stop-color="#7fe9ff" stop-opacity=".28"/>
      <stop offset="1"   stop-color="#3fd0c0" stop-opacity=".05"/>
    </linearGradient>

    <linearGradient id="wave2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0"   stop-color="#38e0c8" stop-opacity=".45"/>
      <stop offset="1"   stop-color="#a8f5e4" stop-opacity=".05"/>
    </linearGradient>

    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#9fd94f"/>
      <stop offset=".45" stop-color="#5fae2e"/>
      <stop offset="1"   stop-color="#2f7a22"/>
    </linearGradient>

    <linearGradient id="hillshine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="bub" cx=".35" cy=".3" r=".75">
      <stop offset="0"   stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset=".45" stop-color="#dff8ff" stop-opacity=".18"/>
      <stop offset=".88" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity=".55"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#sunglow)"/>

  <!-- aurora swooshes, the Vista/Aero signature -->
  <path d="M-100 470 C 240 300, 520 640, 900 430 S 1420 210, 1750 380 L1750 1000 L-100 1000 Z"
        fill="url(#wave1)"/>
  <path d="M-100 640 C 300 480, 560 780, 980 590 S 1460 420, 1750 560 L1750 1000 L-100 1000 Z"
        fill="url(#wave2)"/>

  <!-- glossy hill -->
  <path d="M-100 830 C 260 700, 620 800, 980 760 S 1480 690, 1750 780 L1750 1000 L-100 1000 Z"
        fill="url(#hill)"/>
  <path d="M-100 830 C 260 700, 620 800, 980 760 S 1480 690, 1750 780 L1750 880 C 1420 800, 1000 870, 640 880 S 140 900, -100 930 Z"
        fill="url(#hillshine)"/>

  <!-- bubbles -->
  <g>
    <circle cx="205"  cy="215" r="86" fill="url(#bub)"/>
    <circle cx="178"  cy="182" r="21" fill="#fff" opacity=".55"/>
    <circle cx="1330" cy="330" r="120" fill="url(#bub)"/>
    <circle cx="1290" cy="284" r="28" fill="#fff" opacity=".5"/>
    <circle cx="640"  cy="150" r="46" fill="url(#bub)"/>
    <circle cx="627"  cy="133" r="12" fill="#fff" opacity=".6"/>
    <circle cx="980"  cy="620" r="62" fill="url(#bub)"/>
    <circle cx="962"  cy="597" r="15" fill="#fff" opacity=".5"/>
    <circle cx="420"  cy="560" r="34" fill="url(#bub)"/>
    <circle cx="1130" cy="140" r="26" fill="url(#bub)"/>
    <circle cx="1520" cy="640" r="70" fill="url(#bub)"/>
    <circle cx="60"   cy="700" r="52" fill="url(#bub)"/>
    <circle cx="760"  cy="380" r="18" fill="url(#bub)"/>
  </g>
</svg>
